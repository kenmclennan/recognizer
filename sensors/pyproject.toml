[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recognizer-sensors"
version = "0.1.0"
license = "MIT"
description = "Recognizer's shipped sensors"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-python==0.25.0",
  "tree-sitter-kotlin==0.4.0",
  "tree-sitter-rust==0.24.2",
  "tree-sitter-c-sharp==0.23.5",
  "coverage==7.17.0",
]

[project.scripts]
recognizer-sense-crap = "recognizer_sensors.entry:crap"
recognizer-sense-mutation = "recognizer_sensors.entry:mutation"
recognizer-sense-thresholds = "recognizer_sensors.entry:thresholds"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "jsonschema"]

[tool.uv.sources]
tree-sitter-kotlin = { git = "https://github.com/fwcd/tree-sitter-kotlin", rev = "d6af96d2e23ef0a8ff5ab512864378cf08fba311" }
tree-sitter-c-sharp = { git = "https://github.com/tree-sitter/tree-sitter-c-sharp", rev = "f1c7c1ee21f56a33412c12efb8abe0c483f05f0d" }

[tool.hatch.build.targets.wheel]
packages = ["src/recognizer_sensors"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
