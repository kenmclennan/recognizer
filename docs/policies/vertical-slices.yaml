# Vertical slices: each slice may import shared and nothing from another
# slice, and shared imports no slice. Copy this file to .recognizer/policy.yaml
# in your repository and replace the src/ paths and slice names with your own.

forbid: # one rule per slice naming the others
  - from: [src/orders/**]
    to: [src/billing/**]
  - from: [src/billing/**]
    to: [src/orders/**]
  - from: [src/shared/**]
    to: [src/orders/**, src/billing/**]
  - "* -> foreign:requests"

ignore: [tests/**]
