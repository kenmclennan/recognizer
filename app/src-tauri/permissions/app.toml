[[set]]
identifier = "app-access"
description = "Choose, scan, adopt the scan of, watch for changes to, read a line of and name the folder a window holds, open the folder or a file in it in the editor, and read, write and watch its saved views, build the link to one and take the view a link named, name the author of a note in it, read and watch its module responsibility lines, write the structure findings file, read and remove findings files and read and watch the policy and config for the sensors, run the named registered sensors, describe one module, read the version of the recognizer command, publish what the window shows to the app socket, and answer a command that drives it"
permissions = ["allow-adopt-scan", "allow-answer-window-drive", "allow-choose-folder", "allow-describe-module", "allow-list-views", "allow-open-folder-in-editor", "allow-open-in-editor", "allow-publish-window-state", "allow-read-findings", "allow-read-responsibilities", "allow-read-sensor-inputs", "allow-read-source-line", "allow-recognizer-version", "allow-remove-findings", "allow-rename-view", "allow-renames-since", "allow-run-sensors", "allow-scan-folder", "allow-scans-at", "allow-take-pending-view", "allow-view-author", "allow-view-link", "allow-watch-changes", "allow-watch-responsibilities", "allow-watch-sensor-inputs", "allow-watch-views", "allow-window-folder", "allow-write-structure", "allow-write-view"]

[[set]]
identifier = "settings-access"
description = "Read and write the app's settings"
permissions = ["allow-read-settings", "allow-write-settings"]
