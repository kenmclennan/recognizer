[[set]]
identifier = "app-access"
description = "Choose, scan, adopt the scan of, watch for changes to, read a line of and name the folder a window holds, open the folder or a file in it in the editor, and read, write and watch its saved views, build the link to one and take the view a link named, name the author of a note in it, read and watch its module responsibility lines, describe one module, read the version of the recognizer command, and publish what the window shows to the app socket"
permissions = ["allow-adopt-scan", "allow-choose-folder", "allow-describe-module", "allow-list-views", "allow-open-folder-in-editor", "allow-open-in-editor", "allow-publish-window-state", "allow-read-responsibilities", "allow-read-source-line", "allow-recognizer-version", "allow-rename-view", "allow-renames-since", "allow-scan-folder", "allow-scans-at", "allow-take-pending-view", "allow-view-author", "allow-view-link", "allow-watch-changes", "allow-watch-responsibilities", "allow-watch-views", "allow-window-folder", "allow-write-view"]

[[set]]
identifier = "settings-access"
description = "Read and write the app's settings"
permissions = ["allow-read-settings", "allow-write-settings"]
