permissions = ["allow-adopt-scan", "allow-apply-setup", "allow-answer-describe", "allow-answer-window-drive", "allow-change-range", "allow-choose-folder", "allow-list-branches", "allow-list-history", "allow-list-views", "allow-open-folder-in-editor", "allow-open-in-editor", "allow-planned-work", "allow-publish-window-state", "allow-range-members", "allow-read-describing", "allow-read-doctor", "allow-read-findings", "allow-read-overlays", "allow-read-pull-requests", "allow-read-recent-views", "allow-read-config-keys", "allow-read-run-records", "allow-read-responsibilities", "allow-read-scan-cache", "allow-read-scan-ticks", "allow-read-sensor-inputs", "allow-read-settings", "allow-read-tests-hash", "allow-record-recent-view", "allow-ref-facts", "allow-remove-findings", "allow-remove-view", "allow-rename-view", "allow-renames-since", "allow-run-scan", "allow-run-setup-check", "allow-scans-at", "allow-shipped-describer", "allow-shipped-sensors", "allow-stop-scan", "allow-stop-setup", "allow-take-pending-view", "allow-unwatch-git", "allow-view-author", "allow-view-link", "allow-watch-changes", "allow-watch-external-scan", "allow-watch-git", "allow-watch-responsibilities", "allow-watch-sensor-inputs", "allow-watch-views", "allow-window-folder", "allow-write-repository-config", "allow-write-scan-ticks", "allow-write-settings", "allow-write-structure", "allow-write-view"]
