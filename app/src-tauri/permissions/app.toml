[[set]]
identifier = "app-access"
description = "Choose, run and stop a scan of, read the cached scans and the remembered scan ticks of, write the scan ticks of, adopt the scan of, watch for changes to, read a line of and name the folder a window holds, open the folder or a file in it in the editor, and read, write, remove and watch its saved views, read and record its recently opened views, read the changes of a git range in it, build the link to one and take the view a link named, name the author of a note in it, read and watch its module responsibility lines, write the structure findings file, read and remove findings files, read the overlay files, read and watch the policy and config for the sensors, list the shipped sensors and add or remove one in the config, describe one module, read the version of the recognizer command, publish what the window shows to the app socket, and answer a command that drives it"
permissions = ["allow-adopt-scan", "allow-answer-window-drive", "allow-change-range", "allow-choose-folder", "allow-describe-module", "allow-edit-sensor", "allow-list-views", "allow-open-folder-in-editor", "allow-open-in-editor", "allow-publish-window-state", "allow-read-findings", "allow-read-overlays", "allow-read-recent-views", "allow-read-responsibilities", "allow-read-scan-cache", "allow-read-scan-ticks", "allow-read-sensor-inputs", "allow-read-source-line", "allow-recognizer-version", "allow-record-recent-view", "allow-remove-findings", "allow-remove-view", "allow-rename-view", "allow-renames-since", "allow-run-scan", "allow-scans-at", "allow-shipped-sensors", "allow-stop-scan", "allow-take-pending-view", "allow-view-author", "allow-view-link", "allow-watch-changes", "allow-watch-responsibilities", "allow-watch-sensor-inputs", "allow-watch-views", "allow-window-folder", "allow-write-scan-ticks", "allow-write-structure", "allow-write-view"]

[[set]]
identifier = "settings-access"
description = "Read and write the app's settings"
permissions = ["allow-read-settings", "allow-write-settings"]
