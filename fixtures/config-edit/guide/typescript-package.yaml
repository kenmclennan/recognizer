sensors:
  crap: {}
  mutation: {}
tests:
  - name: web
    language: typescript
    runner: vitest
    directory: packages/web
    command: npx vitest run --config ../../vitest.config.ts --coverage --coverage.reporter=lcov --coverage.reportsDirectory=../../.recognizer/cache/coverage/web
    coverage:
      path: .recognizer/cache/coverage/web/lcov.info
      format: lcov
