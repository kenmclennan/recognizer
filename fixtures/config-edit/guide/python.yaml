sensors:
  crap: {}
  mutation:
    carry: [.venv]
  thresholds: {}
tests:
  - name: api
    language: python
    directory: .
    activate: source .venv/bin/activate
    env: {PYTHONPATH: src}
    command: pytest --cov=src --cov-report=lcov:.recognizer/cache/coverage/api/lcov.info
    coverage:
      path: .recognizer/cache/coverage/api/lcov.info
      format: lcov
