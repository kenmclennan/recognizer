[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recognizer-scan-kotlin"
version = "0.1.0"
license = "MIT"
description = "Scans a Kotlin source tree into a Recognizer scan document"
requires-python = ">=3.11"
dependencies = ["tree-sitter==0.26.0", "tree-sitter-kotlin==0.4.0"]

[project.scripts]
recognizer-scan-kotlin = "recognizer_scan_kotlin.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "jsonschema"]

[tool.uv.sources]
tree-sitter-kotlin = { git = "https://github.com/fwcd/tree-sitter-kotlin", rev = "d6af96d2e23ef0a8ff5ab512864378cf08fba311" }

[tool.hatch.build.targets.wheel]
packages = ["src/recognizer_scan_kotlin"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
