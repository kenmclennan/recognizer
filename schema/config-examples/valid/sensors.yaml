sensors:
  structure:
    hub_threshold: 6
    warnings:
      cycle: true
      hub: false
      policy_drift: false
      unused_exports: false
      orphan:
        entry_points: ["packages/*/src/main.ts", "scripts/**"]
  unused-exports:
    command:
      [node, "{repository}/scripts/unused.mjs", "{commit}", "{output}"]
