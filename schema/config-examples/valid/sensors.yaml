sensors:
  structure:
    warnings:
      cycle: true
      unused_exports: false
      private_imports: true
      long_function: true
      orphan:
        entry_points: ["packages/*/src/main.ts", "scripts/**"]
        entry_annotations: [UseCase]
  unused-exports:
    command:
      [node, "{repository}/scripts/unused.mjs", "{commit}", "{output}"]
