name: sensors

on:
  pull_request:
    paths:
      - packages/sensors/**
      - schema/**
      - fixtures/**
      - tools/scripts/assert-clean-tmpdir.mjs
      - .github/workflows/sensors.yml
      - .github/actions/install-uv/**
  push:
    branches: [main]
    paths:
      - packages/sensors/**
      - schema/**
      - fixtures/**
      - tools/scripts/assert-clean-tmpdir.mjs
      - .github/workflows/sensors.yml
      - .github/actions/install-uv/**

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: packages/sensors
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-uv
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('fixtures/mutation/kotlin/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: node "$GITHUB_WORKSPACE/tools/scripts/assert-clean-tmpdir.mjs" uv run pytest

      - if: failure()
        uses: ./.github/actions/cancel-on-failure
