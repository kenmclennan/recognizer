name: Release

on:
  workflow_run:
    workflows: [app]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: gate (release token present)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.token.outputs.present }}
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: Check for RELEASES_TOKEN
        id: token
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::notice::RELEASES_TOKEN is not set; skipping the release"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: release (build, sign, publish)
    needs: gate
    if: needs.gate.outputs.present == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASES_REPO: kenmclennan/recognizer-releases
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip an already released commit
        id: released
        run: |
          if git tag --points-at "$HEAD_SHA" | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.released.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Compute and stamp the version
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          committed=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          version=$(gh api --paginate "repos/$RELEASES_REPO/releases" --jq '.[].tag_name' | node app/scripts/next-version.mjs "$committed")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node app/scripts/stamp-version.mjs "$version"

      - name: Install dependencies
        if: steps.released.outputs.skip != 'true'
        run: npm ci

      - name: Cache Rust build
        if: steps.released.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build
        if: steps.released.outputs.skip != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          rustup target add aarch64-apple-darwin
          npm run build -w recognizer
          npm run build -w @recognizer/app
          npm run tauri -w @recognizer/app -- build --bundles app --target aarch64-apple-darwin
          dir=app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          for pattern in '*.app.tar.gz' '*.app.tar.gz.sig'; do
            count=$(find "$dir" -maxdepth 1 -name "$pattern" | wc -l | tr -d ' ')
            if [ "$count" != "1" ]; then
              echo "expected exactly one $pattern in $dir, found $count" >&2
              exit 1
            fi
          done
          mkdir -p dist-release
          cp "$dir"/*.app.tar.gz dist-release/recognizer.app.tar.gz
          cp "$dir"/*.app.tar.gz.sig dist-release/recognizer.app.tar.gz.sig

      - name: Release notes and manifest
        if: steps.released.outputs.skip != 'true'
        run: |
          previous=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$previous" ]; then
            git log --format=%s "$previous..$HEAD_SHA" > dist-release/notes.txt
          else
            git log -n 1 --format=%s "$HEAD_SHA" > dist-release/notes.txt
          fi
          VERSION="$VERSION" node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;
            const manifest = {
              version,
              notes: fs.readFileSync("dist-release/notes.txt", "utf8").trim(),
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-aarch64": {
                  signature: fs.readFileSync("dist-release/recognizer.app.tar.gz.sig", "utf8").trim(),
                  url: `https://github.com/kenmclennan/recognizer-releases/releases/download/v${version}/recognizer.app.tar.gz`,
                },
              },
            };
            fs.writeFileSync("dist-release/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Publish the release
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "v$VERSION" --repo "$RELEASES_REPO" --title "Recognizer $VERSION" --notes-file dist-release/notes.txt \
            dist-release/recognizer.app.tar.gz dist-release/recognizer.app.tar.gz.sig dist-release/latest.json

      - name: Tag the source
        if: steps.released.outputs.skip != 'true'
        run: |
          git tag "v$VERSION" "$HEAD_SHA"
          git push origin "v$VERSION"

      - name: Update the releases README
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" releases-repo
          cp .github/release-readme.md releases-repo/README.md
          cd releases-repo
          if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update README"
            git push
          fi
