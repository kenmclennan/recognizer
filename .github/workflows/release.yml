name: Release

on:
  workflow_run:
    workflows: [app]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: gate (release token present)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      present: ${{ steps.token.outputs.present }}
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: Check for RELEASES_TOKEN
        id: token
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::notice::RELEASES_TOKEN is not set; skipping the release"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: release (build, publish)
    needs: gate
    if: needs.gate.outputs.present == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "3"
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASES_REPO: kenmclennan/recognizer-releases
      TAP_REPO: kenmclennan/homebrew-tap
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip an already released commit
        id: released
        run: |
          if git tag --points-at "$HEAD_SHA" | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.released.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Compute and stamp the version
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          committed=$(node -p "require('./package.json').version")
          version=$(gh api --paginate "repos/$RELEASES_REPO/releases" --jq '.[].tag_name' | node app/scripts/next-version.mjs "$committed")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node app/scripts/stamp-version.mjs "$version"

      - name: Install dependencies
        if: steps.released.outputs.skip != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build the toolchain archive
        if: steps.released.outputs.skip != 'true'
        run: |
          npm run build -w recognizer
          npm run build -w recognizer-scan-typescript
          npm run build -w recognizer-describe-claude
          rustup target add aarch64-apple-darwin
          node scripts/build-toolchain.mjs dist-release

      - name: Build the app
        if: steps.released.outputs.skip != 'true'
        run: |
          rustup target add aarch64-apple-darwin
          npm run build -w @recognizer/app
          npm run tauri -w @recognizer/app -- build --bundles app --target aarch64-apple-darwin
          dir=app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          count=$(find "$dir" -maxdepth 1 -name 'Recognizer.app' | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "expected exactly one Recognizer.app in $dir, found $count" >&2
            exit 1
          fi
          cp -R dist-release/toolchain "$dir/Recognizer.app/Contents/Resources/toolchain"
          codesign --force --deep --sign - "$dir/Recognizer.app"
          codesign --verify --deep --strict "$dir/Recognizer.app"
          tar -czf dist-release/recognizer.app.tar.gz -C "$dir" Recognizer.app
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$lsregister" -u "$dir/Recognizer.app" || true
          rm -rf "$dir/Recognizer.app"

      - name: Smoke-test the bundled toolchain
        if: steps.released.outputs.skip != 'true'
        run: |
          smoke=$(mktemp -d)
          repo=$PWD
          tar -xzf dist-release/recognizer.app.tar.gz -C "$smoke"
          toolchain="$smoke/Recognizer.app/Contents/Resources/toolchain"
          node scripts/verify-toolchain.mjs "$toolchain"
          export PATH="$toolchain/commands:$(dirname "$(command -v node)"):/usr/bin:/bin"
          for tool in recognizer recognizer-scan-typescript recognizer-scan-python recognizer-scan-kotlin recognizer-scan-csharp recognizer-scan-rust recognizer-sensors recognizer-sense-crap recognizer-sense-mutation recognizer-sense-thresholds recognizer-describe-claude; do
            got=$("$tool" --version)
            if [ "$got" != "$VERSION" ]; then
              echo "$tool --version printed $got, expected $VERSION" >&2
              exit 1
            fi
          done
          for plugin in recognizer-scan-python recognizer-scan-typescript recognizer-scan-kotlin recognizer-scan-rust recognizer-scan-csharp recognizer-sense-crap recognizer-sense-mutation recognizer-sense-thresholds recognizer-describe-claude; do
            if ! recognizer plugin check "$plugin"; then
              echo "$plugin failed recognizer plugin check" >&2
              exit 1
            fi
          done
          recognizer scan "$repo/fixtures/python/sample"
          recognizer scan "$repo/fixtures/typescript/sample"
          dup=$(mktemp -d)
          cp -R "$repo/fixtures/duplication/sample/." "$dup/"
          git -C "$dup" init -q
          git -C "$dup" add -A
          git -C "$dup" -c user.name=release -c user.email=release@localhost commit -q -m sample
          recognizer scan "$dup"
          if ! grep -q '"kind": "duplication"' "$dup/.recognizer/cache/findings/structure.json" && ! grep -q '"kind":"duplication"' "$dup/.recognizer/cache/findings/structure.json"; then
            echo "recognizer scan wrote no duplication finding for the sample" >&2
            exit 1
          fi
          prompt=$(recognizer-describe-claude --prompt-version)
          case "$prompt" in
            prompt-*) ;;
            *) echo "recognizer-describe-claude --prompt-version printed $prompt" >&2; exit 1 ;;
          esac
          mixed=$(mktemp -d)
          cp -R "$repo/fixtures/kotlin/sample/." "$mixed/"
          cp -R "$repo/fixtures/rust/sample/." "$mixed/"
          cp -R "$repo/fixtures/csharp/sample/." "$mixed/"
          recognizer scan "$mixed"
          for language in kotlin rust csharp; do
            file="$mixed/.recognizer/cache/scan.$language.json"
            if [ ! -f "$file" ]; then
              echo "recognizer scan wrote no $file" >&2
              exit 1
            fi
            got=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).scanner.version)' "$file")
            if [ "$got" != "$VERSION" ]; then
              echo "$file records scanner.version $got, expected $VERSION" >&2
              exit 1
            fi
          done

      - name: Release notes
        if: steps.released.outputs.skip != 'true'
        run: |
          previous=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$previous" ]; then
            git log --format=%s "$previous..$HEAD_SHA" > dist-release/notes.txt
          else
            git log -n 1 --format=%s "$HEAD_SHA" > dist-release/notes.txt
          fi
          {
            echo "From this release one cask installs the app and its tools, and the recognizer formula is retired. An existing machine runs \`brew update && brew uninstall --ignore-dependencies --formula recognizer && brew upgrade --cask recognizer\` once."
            echo
            cat dist-release/notes.txt
          } > dist-release/notes-final.txt
          mv dist-release/notes-final.txt dist-release/notes.txt

      - name: Publish the release
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "v$VERSION" --repo "$RELEASES_REPO" --title "Recognizer $VERSION" --notes-file dist-release/notes.txt \
            dist-release/recognizer-toolchain.tar.gz dist-release/recognizer.app.tar.gz

      - name: Tag the source
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git tag "v$VERSION" "$HEAD_SHA"
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"

      - name: Update the Homebrew tap
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          app_sha=$(shasum -a 256 dist-release/recognizer.app.tar.gz | cut -d' ' -f1)
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
          node scripts/render-homebrew.mjs "$VERSION" "$app_sha" tap-repo
          cd tap-repo
          git rm -f --ignore-unmatch Formula/recognizer.rb
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/recognizer.rb
            git commit -m "recognizer $VERSION"
            git push
          fi

      - name: Update the releases README
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" releases-repo
          cp .github/release-readme.md releases-repo/README.md
          cd releases-repo
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update README"
            git push
          fi

      - name: Remove the built app bundle
        if: always()
        run: |
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          if [ -d app/src-tauri/target ]; then
            find app/src-tauri/target -name 'Recognizer.app' -type d -prune | while read -r bundle; do
              "$lsregister" -u "$bundle" || true
              rm -rf "$bundle"
            done
          fi
