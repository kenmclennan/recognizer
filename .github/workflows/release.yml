name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character SHA to release, defaulting to the head of the ref the run starts on
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: gate (release token present)
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      present: ${{ steps.token.outputs.present }}
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: Check for RELEASES_TOKEN
        id: token
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::RELEASES_TOKEN is not set; a requested release must publish, so it fails"
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: plan (units and CI)
    needs: gate
    if: needs.gate.outputs.present == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    outputs:
      units: ${{ steps.plan.outputs.units }}
      has_units: ${{ steps.plan.outputs.has_units }}
    env:
      HEAD_SHA: ${{ inputs.commit || github.sha }}
    steps:
      - name: Require a full commit SHA
        run: |
          if ! printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "the commit must be a full 40-character SHA, got: $HEAD_SHA" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Plan the train
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          units=$(node tools/scripts/release-train.mjs plan "$HEAD_SHA")
          echo "units=$units" >> "$GITHUB_OUTPUT"
          if [ "$units" = "[]" ]; then
            echo "has_units=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_units=true" >> "$GITHUB_OUTPUT"
          fi

  build-plugins:
    name: build (${{ matrix.unit }})
    needs: plan
    if: needs.plan.outputs.has_units == 'true'
    strategy:
      max-parallel: 1
      matrix:
        unit: ${{ fromJson(needs.plan.outputs.units) }}
    uses: ./.github/workflows/build-plugin.yml
    with:
      unit: ${{ matrix.unit }}
      commit: ${{ inputs.commit || github.sha }}
    secrets: inherit

  release:
    name: release (build, publish)
    needs: [plan, build-plugins]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build-plugins.result == 'success' || needs.build-plugins.result == 'skipped') }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_TARGET_DIR: ${{ github.workspace }}/../../cargo-target
      HEAD_SHA: ${{ inputs.commit || github.sha }}
      RELEASES_REPO: kenmclennan/recognizer-releases
      TAP_REPO: kenmclennan/homebrew-tap
    steps:
      - name: Require a full commit SHA
        run: |
          if ! printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "the commit must be a full 40-character SHA, got: $HEAD_SHA" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Skip an already released commit
        id: released
        run: |
          if git tag --points-at "$HEAD_SHA" | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the plugins bundle in the tap
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if ! gh api "repos/$TAP_REPO/contents/Formula/recognizer-plugins.rb" --silent; then
            echo "the tap has no Formula/recognizer-plugins.rb; release the plugin units and the bundle first" >&2
            exit 1
          fi

      - name: Set up Node
        if: steps.released.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Compute and stamp the version
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          committed=$(node -p "require('./package.json').version")
          version=$(gh api --paginate "repos/$RELEASES_REPO/releases" --jq '.[].tag_name' | node packages/app/scripts/next-version.mjs "$committed")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node packages/app/scripts/stamp-version.mjs "$version"

      - name: Install dependencies
        if: steps.released.outputs.skip != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build the CLI toolchain folder
        if: steps.released.outputs.skip != 'true'
        run: |
          npm run build -w recognizer
          node tools/scripts/build-toolchain.mjs dist-release

      - name: Download the built plugin archives
        if: steps.released.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist-train

      - name: Verify the train's scan schema versions
        if: steps.released.outputs.skip != 'true'
        run: |
          mkdir -p dist-train
          app_schema=$(node --input-type=module -e 'import { SCAN_SCHEMA_VERSION } from "./packages/cli/dist/index.js"; process.stdout.write(String(SCAN_SCHEMA_VERSION))')
          node tools/scripts/release-train.mjs verify "$app_schema" dist-train

      - name: Build the app
        if: steps.released.outputs.skip != 'true'
        run: |
          rustup target add aarch64-apple-darwin
          npm run build -w @recognizer/app
          npm run tauri -w @recognizer/app -- build --bundles app --target aarch64-apple-darwin
          dir="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos"
          count=$(find "$dir" -maxdepth 1 -name 'Recognizer.app' | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "expected exactly one Recognizer.app in $dir, found $count" >&2
            exit 1
          fi
          cp -R dist-release/toolchain "$dir/Recognizer.app/Contents/Resources/toolchain"
          codesign --force --deep --sign - "$dir/Recognizer.app"
          codesign --verify --deep --strict "$dir/Recognizer.app"
          tar -czf dist-release/recognizer.app.tar.gz -C "$dir" Recognizer.app
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$lsregister" -u "$dir/Recognizer.app" || true
          rm -rf "$dir/Recognizer.app"

      - name: Smoke-test the bundled toolchain
        if: steps.released.outputs.skip != 'true'
        run: |
          smoke=$(mktemp -d)
          tar -xzf dist-release/recognizer.app.tar.gz -C "$smoke"
          toolchain="$smoke/Recognizer.app/Contents/Resources/toolchain"
          node tools/scripts/verify-toolchain.mjs "$toolchain"
          export PATH="$toolchain/commands:$(dirname "$(command -v node)"):/usr/bin:/bin"
          got=$(recognizer --version)
          if [ "$got" != "$VERSION" ]; then
            echo "recognizer --version printed $got, expected $VERSION" >&2
            exit 1
          fi

      - name: Open the app ten times
        if: steps.released.outputs.skip != 'true'
        run: node tools/scripts/open-check.mjs --toolchain dist-release/toolchain

      - name: Require the commit on main
        if: steps.released.outputs.skip != 'true'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "$HEAD_SHA is not on main; only commits on main are released" >&2
            exit 1
          fi

      - name: Release notes
        if: steps.released.outputs.skip != 'true'
        run: |
          previous=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$previous" ]; then
            git log --format=%s "$previous..$HEAD_SHA" > dist-release/notes.txt
          else
            git log -n 1 --format=%s "$HEAD_SHA" > dist-release/notes.txt
          fi
          {
            echo "From this release the cask installs the app and the \`recognizer\` command only. Every other command is its own formula in the tap, installed through the \`recognizer-plugins\` bundle, and the umbrella sensors command is gone. An existing machine runs \`brew update && brew uninstall --cask recognizer && brew install --cask recognizer\` once."
            echo
            cat dist-release/notes.txt
          } > dist-release/notes-final.txt
          mv dist-release/notes-final.txt dist-release/notes.txt

      - name: Publish the release
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          for meta in dist-train/*/meta.json; do
            [ -f "$meta" ] || continue
            unit=$(node -p "require('./$meta').unit")
            built=$(node -p "require('./$meta').version")
            gh release create "${unit}-v${built}" --repo "$RELEASES_REPO" --title "$unit $built" \
              --notes "Release archive of the $unit plugin unit, installed by its Homebrew formulae from kenmclennan/tap." \
              "$(dirname "$meta")/$unit-$built.tar.gz"
          done
          gh release create "v$VERSION" --repo "$RELEASES_REPO" --title "Recognizer $VERSION" --notes-file dist-release/notes.txt \
            dist-release/recognizer.app.tar.gz

      - name: Tag the source
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          tags="v$VERSION"
          git tag "v$VERSION" "$HEAD_SHA"
          for meta in dist-train/*/meta.json; do
            [ -f "$meta" ] || continue
            unit=$(node -p "require('./$meta').unit")
            built=$(node -p "require('./$meta').version")
            git tag "${unit}-v${built}" "$HEAD_SHA"
            tags="$tags ${unit}-v${built}"
          done
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" $tags

      - name: Update the releases README
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" releases-repo
          cp .github/release-readme.md releases-repo/README.md
          cd releases-repo
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update README"
            git push
          fi

      - name: Remove the built app bundle
        if: always()
        run: |
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          if [ -d "$CARGO_TARGET_DIR" ]; then
            find "$CARGO_TARGET_DIR" -name 'Recognizer.app' -type d -prune | while read -r bundle; do
              "$lsregister" -u "$bundle" || true
              rm -rf "$bundle"
            done
          fi

  tap:
    name: tap (one commit)
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ inputs.commit || github.sha }}
      RELEASES_REPO: kenmclennan/recognizer-releases
      TAP_REPO: kenmclennan/homebrew-tap
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Render the cask and every formula into one commit
        run: |
          gh api --paginate "repos/$RELEASES_REPO/releases" --jq '.[].tag_name' > tags.txt
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
          mkdir -p assets

          app_tag=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' tags.txt | sort -V | tail -n 1)
          app_version=${app_tag#v}
          gh release download "$app_tag" --repo "$RELEASES_REPO" --pattern recognizer.app.tar.gz --dir assets --clobber
          app_sha=$(shasum -a 256 assets/recognizer.app.tar.gz | cut -d' ' -f1)
          node tools/scripts/render-homebrew.mjs cask "$app_version" "$app_sha" tap-repo

          for unit in $(node -p "require('./tools/packaging/units.json').units.map((entry) => entry.unit).join(' ')"); do
            tag=$(grep -E "^${unit}-v[0-9]+\.[0-9]+\.[0-9]+$" tags.txt | sort -V | tail -n 1 || true)
            if [ -z "$tag" ]; then
              echo "$unit has no published release" >&2
              exit 1
            fi
            built=${tag#"${unit}-v"}
            gh release download "$tag" --repo "$RELEASES_REPO" --pattern "$unit-$built.tar.gz" --dir assets --clobber
            sha=$(shasum -a 256 "assets/$unit-$built.tar.gz" | cut -d' ' -f1)
            node tools/scripts/render-homebrew.mjs unit "$unit" "$built" "$sha" tap-repo
          done

          node tools/scripts/render-homebrew.mjs members | sort > members.txt
          current=""
          if [ -f tap-repo/Formula/recognizer-plugins.rb ]; then
            current=$(grep -oE 'depends_on "[^"]+"' tap-repo/Formula/recognizer-plugins.rb | sed -E 's/depends_on "([^"]+)"/\1/' | sort)
          fi
          if [ "$current" != "$(cat members.txt)" ]; then
            last=$(grep -E '^recognizer-plugins-v[0-9]+$' tags.txt | sed -E 's/^recognizer-plugins-v//' | sort -n | tail -n 1 || true)
            bundle=$(( ${last:-0} + 1 ))
            mkdir -p bundle
            cp members.txt bundle/members.txt
            tar -czf "assets/recognizer-plugins-$bundle.tar.gz" -C bundle members.txt
            gh release create "recognizer-plugins-v$bundle" --repo "$RELEASES_REPO" --title "recognizer-plugins $bundle" \
              --notes "The member list of the recognizer-plugins bundle formula." \
              "assets/recognizer-plugins-$bundle.tar.gz"
            bundle_sha=$(shasum -a 256 "assets/recognizer-plugins-$bundle.tar.gz" | cut -d' ' -f1)
            node tools/scripts/render-homebrew.mjs bundle "$bundle" "$bundle_sha" tap-repo
          fi

          cd tap-repo
          git rm -f --ignore-unmatch Formula/recognizer.rb
          git rm -f --ignore-unmatch Formula/recognizer-sense-thresholds.rb
          git add -A Casks Formula
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "recognizer $app_version"
            pushed=false
            for attempt in 1 2 3; do
              if git push; then
                pushed=true
                break
              fi
              git pull --rebase
            done
            if [ "$pushed" != "true" ]; then
              echo "the tap push was refused three times" >&2
              exit 1
            fi
          fi
