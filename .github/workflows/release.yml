name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character SHA to release, defaulting to the head of the ref the run starts on
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: gate (release token present)
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      present: ${{ steps.token.outputs.present }}
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: Check for RELEASES_TOKEN
        id: token
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::RELEASES_TOKEN is not set; a requested release must publish, so it fails"
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: release (build, publish)
    needs: gate
    if: needs.gate.outputs.present == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "3"
      HEAD_SHA: ${{ inputs.commit || github.sha }}
      RELEASES_REPO: kenmclennan/recognizer-releases
      TAP_REPO: kenmclennan/homebrew-tap
    steps:
      - name: Require a full commit SHA
        run: |
          if ! printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "the commit must be a full 40-character SHA, got: $HEAD_SHA" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Skip an already released commit
        id: released
        run: |
          if git tag --points-at "$HEAD_SHA" | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the app workflow to have passed
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow app.yml --commit "$HEAD_SHA" --json status,conclusion)
          if [ "$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')" != "0" ]; then
            echo "an app workflow run on $HEAD_SHA is still going" >&2
            exit 1
          fi
          if [ "$(echo "$runs" | jq 'length')" != "0" ] && [ "$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')" = "0" ]; then
            echo "no app workflow run on $HEAD_SHA succeeded" >&2
            exit 1
          fi

      - name: Require the plugins bundle in the tap
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if ! gh api "repos/$TAP_REPO/contents/Formula/recognizer-plugins.rb" --silent; then
            echo "the tap has no Formula/recognizer-plugins.rb; release the plugin units and the bundle first" >&2
            exit 1
          fi

      - name: Set up Node
        if: steps.released.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Compute and stamp the version
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          committed=$(node -p "require('./package.json').version")
          version=$(gh api --paginate "repos/$RELEASES_REPO/releases" --jq '.[].tag_name' | node app/scripts/next-version.mjs "$committed")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node app/scripts/stamp-version.mjs "$version"

      - name: Install dependencies
        if: steps.released.outputs.skip != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build the CLI toolchain folder
        if: steps.released.outputs.skip != 'true'
        run: |
          npm run build -w recognizer
          node scripts/build-toolchain.mjs dist-release

      - name: Build the app
        if: steps.released.outputs.skip != 'true'
        run: |
          rustup target add aarch64-apple-darwin
          npm run build -w @recognizer/app
          npm run tauri -w @recognizer/app -- build --bundles app --target aarch64-apple-darwin
          dir=app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          count=$(find "$dir" -maxdepth 1 -name 'Recognizer.app' | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "expected exactly one Recognizer.app in $dir, found $count" >&2
            exit 1
          fi
          cp -R dist-release/toolchain "$dir/Recognizer.app/Contents/Resources/toolchain"
          codesign --force --deep --sign - "$dir/Recognizer.app"
          codesign --verify --deep --strict "$dir/Recognizer.app"
          tar -czf dist-release/recognizer.app.tar.gz -C "$dir" Recognizer.app
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$lsregister" -u "$dir/Recognizer.app" || true
          rm -rf "$dir/Recognizer.app"

      - name: Smoke-test the bundled toolchain
        if: steps.released.outputs.skip != 'true'
        run: |
          smoke=$(mktemp -d)
          tar -xzf dist-release/recognizer.app.tar.gz -C "$smoke"
          toolchain="$smoke/Recognizer.app/Contents/Resources/toolchain"
          node scripts/verify-toolchain.mjs "$toolchain"
          export PATH="$toolchain/commands:$(dirname "$(command -v node)"):/usr/bin:/bin"
          got=$(recognizer --version)
          if [ "$got" != "$VERSION" ]; then
            echo "recognizer --version printed $got, expected $VERSION" >&2
            exit 1
          fi

      - name: Open the app ten times
        if: steps.released.outputs.skip != 'true'
        run: node scripts/open-check.mjs --toolchain dist-release/toolchain

      - name: Require the commit on main
        if: steps.released.outputs.skip != 'true'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "$HEAD_SHA is not on main; only commits on main are released" >&2
            exit 1
          fi

      - name: Release notes
        if: steps.released.outputs.skip != 'true'
        run: |
          previous=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$previous" ]; then
            git log --format=%s "$previous..$HEAD_SHA" > dist-release/notes.txt
          else
            git log -n 1 --format=%s "$HEAD_SHA" > dist-release/notes.txt
          fi
          {
            echo "From this release the cask installs the app and the \`recognizer\` command only. Every other command is its own formula in the tap, installed through the \`recognizer-plugins\` bundle, and the umbrella sensors command is gone. An existing machine runs \`brew update && brew uninstall --cask recognizer && brew install --cask recognizer\` once."
            echo
            cat dist-release/notes.txt
          } > dist-release/notes-final.txt
          mv dist-release/notes-final.txt dist-release/notes.txt

      - name: Publish the release
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "v$VERSION" --repo "$RELEASES_REPO" --title "Recognizer $VERSION" --notes-file dist-release/notes.txt \
            dist-release/recognizer.app.tar.gz

      - name: Tag the source
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git tag "v$VERSION" "$HEAD_SHA"
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"

      - name: Update the Homebrew tap
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          app_sha=$(shasum -a 256 dist-release/recognizer.app.tar.gz | cut -d' ' -f1)
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
          node scripts/render-homebrew.mjs cask "$VERSION" "$app_sha" tap-repo
          cd tap-repo
          git rm -f --ignore-unmatch Formula/recognizer.rb
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/recognizer.rb
            git commit -m "recognizer $VERSION"
            git push
          fi

      - name: Update the releases README
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" releases-repo
          cp .github/release-readme.md releases-repo/README.md
          cd releases-repo
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update README"
            git push
          fi

      - name: Remove the built app bundle
        if: always()
        run: |
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          if [ -d app/src-tauri/target ]; then
            find app/src-tauri/target -name 'Recognizer.app' -type d -prune | while read -r bundle; do
              "$lsregister" -u "$bundle" || true
              rm -rf "$bundle"
            done
          fi
