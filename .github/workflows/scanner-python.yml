name: scanner-python

on:
  pull_request:
    paths:
      - packages/scanners/python/**
      - schema/**
      - fixtures/**
      - tools/scripts/assert-clean-tmpdir.mjs
      - .github/workflows/scanner-python.yml
      - .github/actions/install-uv/**
  push:
    branches: [main]
    paths:
      - packages/scanners/python/**
      - schema/**
      - fixtures/**
      - tools/scripts/assert-clean-tmpdir.mjs
      - .github/workflows/scanner-python.yml
      - .github/actions/install-uv/**

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: packages/scanners/python
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-uv
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: node "$GITHUB_WORKSPACE/tools/scripts/assert-clean-tmpdir.mjs" uv run pytest

      - if: failure()
        uses: ./.github/actions/cancel-on-failure
