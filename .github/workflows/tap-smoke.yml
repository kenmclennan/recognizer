name: tap-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install, check, remove and restore through the tap
        run: node scripts/tap-smoke.mjs "$PWD"
