name: app

on:
  pull_request:
    paths:
      - app/**
      - check/**
      - schema/**
      - package.json
      - package-lock.json
      - biome.json
      - .github/workflows/app.yml
  push:
    branches: [main]
    paths:
      - app/**
      - check/**
      - schema/**
      - package.json
      - package-lock.json
      - biome.json
      - .github/workflows/app.yml

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (typecheck, tests, lint, build)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci


      - name: Run quality gate
        run: npm run check:app
