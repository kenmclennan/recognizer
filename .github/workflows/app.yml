name: app

on:
  pull_request:
    paths:
      - app/**
      - check/**
      - schema/**
      - scripts/**
      - packaging/**
      - scanners/**
      - THIRD-PARTY-NOTICES.md
      - package.json
      - package-lock.json
      - biome.json
      - .github/workflows/app.yml
  push:
    branches: [main]
    paths:
      - app/**
      - check/**
      - schema/**
      - scripts/**
      - packaging/**
      - scanners/**
      - THIRD-PARTY-NOTICES.md
      - package.json
      - package-lock.json
      - biome.json
      - .github/workflows/app.yml

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  check:
    name: check (typecheck, tests, lint, build)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      LC_MAX_AGENTS: "4"
      CARGO_TARGET_DIR: ${{ github.workspace }}/../../cargo-target
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install the look-test browser
        run: npx -w @recognizer/app playwright install webkit

      - name: Run quality gate
        run: npm run check:app

      - if: failure()
        uses: ./.github/actions/cancel-on-failure
