name: app

on:
  pull_request:
    paths:
      - app/**
      - check/**
      - schema/**
      - package.json
      - package-lock.json
      - biome.json
      - .github/workflows/app.yml
  push:
    branches: [main]
    paths:
      - app/**
      - check/**
      - schema/**
      - package.json
      - package-lock.json
      - biome.json
      - .github/workflows/app.yml

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (typecheck, tests, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri system libraries
        timeout-minutes: 15
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          cache-on-failure: true

      - name: Run quality gate
        run: npm run check:app
