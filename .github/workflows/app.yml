name: app

on:
  pull_request:
    paths:
      - packages/app/**
      - packages/core/**
      - packages/cli/**
      - schema/**
      - tools/scripts/**
      - tools/packaging/**
      - packages/scanners/**
      - packages/sensors/**
      - packages/describers/**
      - THIRD-PARTY-NOTICES.md
      - package.json
      - package-lock.json
      - biome.json
      - .github/workflows/app.yml
      - .github/workflows/release.yml
  push:
    branches: [main]

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tools/scripts/ci-changes.mjs "$EVENT" "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  check:
    needs: [changes]
    name: check (typecheck, tests, lint, build)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      LC_MAX_AGENTS: "4"
      CARGO_TARGET_DIR: ${{ github.workspace }}/../../cargo-target
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: node tools/scripts/signal-witness.mjs npm ci --prefer-offline --no-audit --no-fund

      - name: Install the look-test browser
        run: node tools/scripts/signal-witness.mjs npx -w @recognizer/app playwright install webkit

      - name: Run quality gate
        env:
          RECOGNIZER_SKIP_RUST: ${{ needs.changes.outputs.rust == 'true' && '' || '1' }}
        run: node tools/scripts/signal-witness.mjs npm run check:app

      - name: Run graph-layout tests
        run: node tools/scripts/signal-witness.mjs npm run test:layout -w @recognizer/app
