name: build-plugin

on:
  workflow_call:
    inputs:
      unit:
        required: true
        type: string
      commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ inputs.unit }})
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "3"
      UNIT: ${{ inputs.unit }}
      RELEASES_REPO: kenmclennan/recognizer-releases
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up uv
        uses: ./.github/actions/install-uv

      - name: Compute and stamp the version
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          committed=$(node packages/app/scripts/stamp-version.mjs committed "$UNIT")
          version=$(gh api --paginate "repos/$RELEASES_REPO/releases" --jq '.[].tag_name' | node packages/app/scripts/next-version.mjs "$committed" "${UNIT}-v")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node packages/app/scripts/stamp-version.mjs "$version" "$UNIT"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build the unit
        run: |
          npm run build -w recognizer
          case "$UNIT" in
            scan-typescript) npm run build -w recognizer-scan-typescript ;;
            describe-claude) npm run build -w recognizer-describe-claude ;;
            scan-rust) rustup target add aarch64-apple-darwin ;;
          esac
          node scripts/build-plugin.mjs "$UNIT" "$VERSION" dist-release

      - name: Smoke-test the archive
        run: |
          repo=$PWD
          smoke=$(mktemp -d)
          shim=$(mktemp -d)
          tar -xzf "dist-release/$UNIT-$VERSION.tar.gz" -C "$smoke"
          printf '#!/bin/sh\nexec node "%s/check/dist/bin.js" "$@"\n' "$repo" > "$shim/recognizer"
          chmod +x "$shim/recognizer"
          node scripts/verify-plugin.mjs "$UNIT" "$smoke"
          export PATH="$smoke/bin:$shim:$(dirname "$(command -v node)"):/usr/bin:/bin"
          for command in $(node -p "require('./packaging/units.json').units.find((entry) => entry.unit === process.env.UNIT).formulae.map((one) => one.command).join(' ')"); do
            got=$("$command" --version)
            if [ "$got" != "$VERSION" ]; then
              echo "$command --version printed $got, expected $VERSION" >&2
              exit 1
            fi
            if ! recognizer plugin check "$command"; then
              echo "$command failed recognizer plugin check" >&2
              exit 1
            fi
            case "$UNIT" in
              scan-*)
                "$command" manifest | node -e 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write(m.scan_schema_version === undefined ? "" : String(m.scan_schema_version))' > "$repo/declared-scan-schema.txt"
                ;;
            esac
          done
          scan_fixture() {
            work=$(mktemp -d)
            cp -R "$repo/fixtures/$1/sample/." "$work/"
            recognizer scan "$work"
            if [ "$2" = "version" ]; then
              file="$work/.recognizer/cache/scan.$1.json"
              if [ ! -f "$file" ]; then
                echo "recognizer scan wrote no $file" >&2
                exit 1
              fi
              got=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).scanner.version)' "$file")
              if [ "$got" != "$VERSION" ]; then
                echo "$file records scanner.version $got, expected $VERSION" >&2
                exit 1
              fi
            fi
          }
          case "$UNIT" in
            scan-python) scan_fixture python plain ;;
            scan-typescript) scan_fixture typescript plain ;;
            scan-kotlin) scan_fixture kotlin version ;;
            scan-csharp) scan_fixture csharp version ;;
            scan-rust) scan_fixture rust version ;;
            describe-claude)
              prompt=$(recognizer-describe-claude manifest | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).prompt_version)')
              case "$prompt" in
                prompt-*) ;;
                *) echo "recognizer-describe-claude manifest carries prompt_version $prompt" >&2; exit 1 ;;
              esac
              ;;
          esac

      - name: Record what was built
        run: |
          declared=""
          if [ -f declared-scan-schema.txt ]; then
            declared=$(cat declared-scan-schema.txt)
          fi
          mkdir -p train
          cp "dist-release/$UNIT-$VERSION.tar.gz" train/
          UNIT="$UNIT" VERSION="$VERSION" DECLARED="$declared" node -e '
            const declared = process.env.DECLARED;
            const meta = {
              unit: process.env.UNIT,
              version: process.env.VERSION,
              scan_schema_version: declared === "" ? null : Number(declared),
            };
            require("fs").writeFileSync("train/meta.json", JSON.stringify(meta));
          '

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ inputs.unit }}
          path: train/
          if-no-files-found: error
