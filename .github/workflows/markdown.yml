name: markdown

on:
  pull_request:
    paths:
      - "**/*.md"
      - .markdownlint.json
      - package.json
      - package-lock.json
      - .github/workflows/markdown.yml
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  actions: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx prettier --check --prose-wrap=never "**/*.md"
      - run: npm run lint:md

      - if: failure()
        uses: ./.github/actions/cancel-on-failure
