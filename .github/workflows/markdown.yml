name: markdown

on:
  pull_request:
    paths:
      - "**/*.md"
      - .markdownlint.json
      - package.json
      - package-lock.json
      - .github/workflows/markdown.yml
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - .markdownlint.json
      - package.json
      - package-lock.json
      - .github/workflows/markdown.yml

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx prettier --check --prose-wrap=never "**/*.md"
      - run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#THIRD-PARTY-NOTICES.md" "#app/node_modules" "#app/src-tauri/target" "#scanners/python/.venv" "#scanners/kotlin/.venv" "#describers/claude/prompt.md"
