name: schema-compat

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: git fetch origin main --tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build -w recognizer
      - run: node tools/scripts/schema-compat.mjs "${{ github.event.pull_request.head.sha || github.sha }}"
