name: check

on:
  pull_request:
    paths:
      - check/**
      - scanners/**
      - describers/**
      - scripts/**
      - policies/**
      - schema/**
      - fixtures/**
      - package.json
      - package-lock.json
      - biome.json
      - .github/workflows/check.yml
  push:
    branches: [main]
    paths:
      - check/**
      - scanners/**
      - describers/**
      - scripts/**
      - policies/**
      - schema/**
      - fixtures/**
      - package.json
      - package-lock.json
      - biome.json
      - .github/workflows/check.yml

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint -w check
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --project scanners/python
      - run: npm run build -w recognizer-scan-typescript
      - run: npm run build -w recognizer-describe-claude
      - run: npm run build -w check
      - run: node scripts/assert-clean-tmpdir.mjs npm test -w check
      - run: node scripts/build-toolchain.mjs "$RUNNER_TEMP/toolchain"
      - run: |
          extracted=$(mktemp -d)
          tar -xzf "$RUNNER_TEMP/toolchain/recognizer-toolchain.tar.gz" -C "$extracted"
          node scripts/verify-toolchain.mjs "$extracted"
