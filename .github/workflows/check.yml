name: check

on:
  pull_request:
    paths:
      - packages/core/**
      - packages/cli/**
      - packages/scanners/**
      - packages/sensors/**
      - packages/describers/**
      - tools/scripts/**
      - tools/packaging/**
      - docs/policies/**
      - schema/**
      - fixtures/**
      - package.json
      - package-lock.json
      - biome.json
      - .github/workflows/check.yml
      - .github/actions/install-uv/**
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint -w packages/core
      - run: npm run lint -w packages/cli
      - uses: ./.github/actions/install-uv
      - run: uv sync --locked --project packages/scanners/python
      - run: uv sync --locked --project packages/sensors
      - run: npm run build -w recognizer-scan-typescript
      - run: npm run build -w recognizer-describe-claude
      - run: npm run build -w packages/cli
      - run: node tools/scripts/assert-clean-tmpdir.mjs npm test -w packages/core
      - run: node tools/scripts/assert-clean-tmpdir.mjs npm test -w packages/cli
        env:
          RECOGNIZER_REQUIRE_TEMPLATE_TOOLCHAINS: "1"

  toolchain:
    needs: test
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build -w packages/cli
      - run: node tools/scripts/build-toolchain.mjs "$RUNNER_TEMP/toolchain"
      - run: |
          extracted=$(mktemp -d)
          tar -xzf "$RUNNER_TEMP/toolchain/recognizer-toolchain.tar.gz" -C "$extracted"
          node tools/scripts/verify-toolchain.mjs "$extracted"

  plugins:
    needs: test
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        unit: [scan-python, scan-typescript, scan-kotlin, scan-csharp, scan-rust, sensors, describe-claude]
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: ./.github/actions/install-uv
      - run: rustup target add aarch64-apple-darwin
      - run: npm run build -w packages/cli
      - run: npm run build -w recognizer-scan-typescript
      - run: npm run build -w recognizer-describe-claude
      - run: |
          version=$(node packages/app/scripts/stamp-version.mjs committed "${{ matrix.unit }}")
          node tools/scripts/build-plugin.mjs "${{ matrix.unit }}" "$version" "$RUNNER_TEMP/plugin-${{ matrix.unit }}"
          extracted=$(mktemp -d)
          tar -xzf "$RUNNER_TEMP/plugin-${{ matrix.unit }}/${{ matrix.unit }}-$version.tar.gz" -C "$extracted"
          node tools/scripts/verify-plugin.mjs "${{ matrix.unit }}" "$extracted"
