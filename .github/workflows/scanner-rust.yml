name: scanner-rust

on:
  pull_request:
    paths:
      - packages/scanners/rust/**
      - schema/**
      - fixtures/**
      - packages/app/src-tauri/**
      - scripts/assert-clean-tmpdir.mjs
      - .github/workflows/scanner-rust.yml
  push:
    branches: [main]
    paths:
      - packages/scanners/rust/**
      - schema/**
      - fixtures/**
      - packages/app/src-tauri/**
      - scripts/assert-clean-tmpdir.mjs
      - .github/workflows/scanner-rust.yml

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/scanners/rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: node "$GITHUB_WORKSPACE/scripts/assert-clean-tmpdir.mjs" cargo test --locked

      - if: failure()
        uses: ./.github/actions/cancel-on-failure
