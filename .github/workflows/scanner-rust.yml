name: scanner-rust

on:
  pull_request:
    paths:
      - packages/scanners/rust/**
      - schema/**
      - fixtures/**
      - packages/app/src-tauri/**
      - tools/scripts/assert-clean-tmpdir.mjs
      - .github/workflows/scanner-rust.yml
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
    defaults:
      run:
        working-directory: packages/scanners/rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: node "$GITHUB_WORKSPACE/tools/scripts/assert-clean-tmpdir.mjs" cargo test --locked
